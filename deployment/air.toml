root = "/app"
tmp_dir = "/tmp/air"
env_files = [".env"]

[build]
cmd = "go build -o /tmp/air/api ./cmd/api"
entrypoint = ["/tmp/air/api"]
include_ext = ["go", "mod", "sum", "html", "tmpl", "tpl"]
exclude_dir = [".git", "bin", "vendor", "tmp"]
exclude_regex = ["_test\\.go"]
delay = 500
# Polling also detects changes reliably through Docker Desktop bind mounts.
poll = true
poll_interval = 500
stop_on_error = true
send_interrupt = true
kill_delay = "10s"

[log]
time = true

[misc]
clean_on_exit = true
