name: stroberi-writes-dev

services:
  backend:
    build:
      context: ..
      dockerfile: deployment/Dockerfile
      target: backend-dev
    init: true
    restart: unless-stopped
    working_dir: /app
    environment:
      PORT: "8080"
      GIN_MODE: debug
      CGO_ENABLED: "0"
      GOCACHE: /root/.cache/go-build
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8080}:8080"
    volumes:
      - ../backend:/app
      - ./air.toml:/etc/air.toml:ro
      - go_modules:/go/pkg/mod
      - go_build:/root/.cache/go-build
    tmpfs:
      - /tmp:exec,mode=1777
    stop_grace_period: 15s
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/api/v1/health"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 120s

  frontend:
    build:
      context: ..
      dockerfile: deployment/Dockerfile
      target: frontend-dev
    init: true
    restart: unless-stopped
    working_dir: /app
    environment:
      NODE_ENV: development
      NEXT_TELEMETRY_DISABLED: "1"
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-3000}:3000"
    volumes:
      - ../frontend:/app
      - frontend_modules:/app/node_modules
      - frontend_next:/app/.next
      - npm_cache:/root/.npm
    stop_grace_period: 15s

volumes:
  go_modules:
  go_build:
  frontend_modules:
  frontend_next:
  npm_cache:
